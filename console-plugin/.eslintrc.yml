root: true
env:
  browser: true
  es6: true
extends:
  - eslint:recommended
  - plugin:react/recommended
  - plugin:@typescript-eslint/recommended
parser: '@typescript-eslint/parser'
parserOptions:
  ecmaFeatures:
    jsx: true
  ecmaVersion: 2016
  sourceType: module
plugins:
  - react
  - '@typescript-eslint'
rules:
  react/prop-types: 'off'
settings:
  react:
    version: detect
