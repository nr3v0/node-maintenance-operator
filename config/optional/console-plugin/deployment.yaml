apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/component: console-plugin
  name: console-plugin
  namespace: system
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: console-plugin
  template:
    metadata:
      labels:
        app.kubernetes.io/component: console-plugin
    spec:
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 3
              preference:
                matchExpressions:
                  - key: node-role.kubernetes.io/infra
                    operator: Exists
            - weight: 1
              preference:
                matchExpressions:
                  - key: node-role.kubernetes.io/master
                    operator: Exists
            - weight: 1
              preference:
                matchExpressions:
                  - key: node-role.kubernetes.io/control-plane
                    operator: Exists
      tolerations:
        - effect: NoSchedule
          key: node-role.kubernetes.io/master
          operator: Exists
        - effect: NoSchedule
          key: node-role.kubernetes.io/control-plane
          operator: Exists
        - effect: NoSchedule
          key: node-role.kubernetes.io/infra
          operator: Exists
        - effect: NoExecute
          key: node-role.kubernetes.io/infra
          operator: Exists
      containers:
        - image: console-plugin:latest
          name: console-plugin
          ports:
            - containerPort: 9443
              name: nmc-server
              protocol: TCP
          resources:
            requests:
              cpu: 10m
              memory: 50Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          livenessProbe:
            tcpSocket:
              port: 9443
            periodSeconds: 10
            timeoutSeconds: 3
          readinessProbe:
            tcpSocket:
              port: 9443
            periodSeconds: 5
            timeoutSeconds: 3
          terminationMessagePolicy: FallbackToLogsOnError
          volumeMounts:
            - mountPath: /var/serving-cert
              name: plugin-serving-cert
              readOnly: true
            - mountPath: /var/log/nginx
              name: nginx-log
            - mountPath: /var/lib/nginx/tmp
              name: nginx-tmp
            - mountPath: /run
              name: nginx-run
      securityContext:
        runAsNonRoot: true
      automountServiceAccountToken: false
      volumes:
        - name: plugin-serving-cert
          secret:
            defaultMode: 420
            secretName: node-maintenance-console-plugin-cert
        - name: nginx-log
          emptyDir: {}
        - name: nginx-tmp
          emptyDir: {}
        - name: nginx-run
          emptyDir: {}
