# Alerts based on the metrics exposed by the operator
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  labels:
    control-plane: controller-manager
  name: controller-manager-alerts
  namespace: system
spec:
  groups:
    - name: node-maintenance
      # evaluate faster than the platform default of 30s, so the alert shows right after a maintenance starts
      interval: 10s
      rules:
        - alert: NodeInMaintenance
          expr: max by (node, nodemaintenance, reason) (nmo_node_in_maintenance) == 1
          # no pending period: a maintenance is a deliberate action, there is no flapping to filter out
          labels:
            severity: warning
          annotations:
            summary: Node is in maintenance.
            # The node name must appear only once in the description, else the console can't replace it
            # with a link to the node. So the NodeMaintenance name, which often contains the node name,
            # is only available as label.
            description: >-
              Node {{ $labels.node }} is in maintenance, reason: "{{ $labels.reason }}". The node is
              cordoned and drained: no new workloads will be scheduled on it, and it is excluded from
              automated remediation, until its NodeMaintenance resource is deleted.
            runbook_url: https://github.com/medik8s/node-maintenance-operator/blob/main/docs/runbook.md#nodeinmaintenance
